<h2>Time de Colaboradores</h2>
<div class="buscar-colaboradores" [formGroup]="formColaborador">
  <div class="form-group buscar-colaborador">
    <div class="input">
      <input type="text" class="input-colaborador" placeholder="Busque por nome, e-mail ou perfil" formControlName="colaborador">
    </div>
  </div>
  <button type="button" class="btn-primary icon" (click)="buscarColaborador()">
    <span class="material-symbols-outlined">
      search
    </span>
  </button>
</div>
<div class="novo-colaborador-container mt-2">
  <button type="button" class="btn-primary icon" (click)="buscarColaborador()">
    <span class="material-symbols-outlined">
      add
    </span>
  </button>
</div>
<div class="tabela mt-2">
  <table>
    <thead>
      <tr>
        <th style="min-width: 33rem;">Nome do colaborador</th>
        <th style="min-width: 20rem;">E-mail</th>
        <th style="min-width: 20rem;">Perfil</th>
        <th style="min-width: 2rem;"></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let colaborador of listaColaboradores">
        <td style="min-width: 33rem;">{{ colaborador.nome }}</td>
        <td style="min-width: 20rem; text-align: center">{{ colaborador.email }}</td>
        <td style="min-width: 20rem; text-align: center">{{ colaborador.perfil }}</td>
        <td class="icones-tabela" style="min-width: 2rem;">
          <span class="material-symbols-outlined">edit</span>
          <span class="material-symbols-outlined">delete</span>
        </td>
      </tr>
      <tr *ngIf="!listaColaboradores || listaColaboradores.length === 0">
        <td colspan="4" style="text-align: center">Nenhum registro encontrado</td>
      </tr>
    </tbody>
  </table>
</div>

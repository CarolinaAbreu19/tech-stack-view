<div class="cabecalho">
  <div class="dados-tech-stack">
    <h2 class="titulo">Tech Stack {{ nomeTechStack }} - Preenchimento</h2>
    <div class="progresso-preenchimento">
      <h3 class="progresso">0% (0 / 90)</h3>
      <button type="button" class="btn-finalizar" (click)="salvarPreenchimento()">Finalizar</button>
    </div>
  </div>
  <div class="legenda-nivel-conhecimento">
    <app-legenda-nivel-conhecimento></app-legenda-nivel-conhecimento>
  </div>
</div>
<div class="accordion">
  <div class="accordion-item">
    <div class="accordion-header" (click)="toggleAccordion(0)">
      <h3>Conhecimentos Específicos</h3>
    </div>
    <div class="accordion-content" [ngClass]="{'active': activeIndex === 0}">
      <div class="accordion" *ngFor="let item of informacoesTechStack.areasConhecimento">
        <div class="accordion-header" *ngIf="item.idTipoConhecimento === tipoConhecimentoEnum.Especifico" (click)="obterAssuntos(item.id)">{{ item.nome }}</div>
          <div class="accordion-subcontent" *ngFor="let assunto of listaAssuntos" [ngClass]="{'active': activeAssunto === item.id}">
            <p>{{ assunto.nome }}</p>
            <div class="btn-container"><app-painel-nivel-conhecimento 
              (nivelSelecionadoEmitter)="salvarResposta($event, assunto.id)"
              ></app-painel-nivel-conhecimento></div>
            </div>
          <div class="accordion-empty" *ngIf="listaAssuntos.length === 0" [ngClass]="{'active': activeAssunto === item.id}">Nenhum registro encontrado</div>
      </div>
    </div>
  </div>

  <div class="accordion-item">
    <div class="accordion-header" (click)="toggleAccordion(1)">
      <h3>Conhecimentos Comuns</h3>
    </div>
    <div class="accordion-content" [ngClass]="{'active': activeIndex === 1}">
      <div class="accordion" *ngFor="let item of informacoesTechStack.areasConhecimento">
        <div class="accordion-header" *ngIf="item.idTipoConhecimento === tipoConhecimentoEnum.Comum" (click)="obterAssuntos(item.id)">{{ item.nome }}</div>
          <div class="accordion-subcontent" *ngFor="let assunto of listaAssuntos" [ngClass]="{'active': activeAssunto === item.id}">
            <p>{{ assunto.nome }}</p>
            <div class="btn-container"><app-painel-nivel-conhecimento 
              (nivelSelecionadoEmitter)="salvarResposta($event, assunto.id)"
              ></app-painel-nivel-conhecimento></div>
          </div>
          <div class="accordion-empty" *ngIf="listaAssuntos.length === 0" [ngClass]="{'active': activeAssunto === item.id}">Nenhum registro encontrado</div>
      </div>
    </div>
  </div>
</div>
